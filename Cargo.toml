[package]
name = "cmake-tui-tool"
version = "1.2.0"
edition = "2024"

[dependencies]
cursive = { version = "0.21.1", features = ["crossterm-backend", "toml", "markdown"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }
libc = "0.2"
